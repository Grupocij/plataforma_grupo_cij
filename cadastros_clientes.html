<!DOCTYPE html><html lang="pt-BR"><head><title>Clientes - Portal CIJ</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="erp-cadastros-v4.css"></head>
<body data-erp-page="clientes">
<main id="main-content" class="hidden h-[calc(100vh-64px)] overflow-y-auto erp-scroll">
<div class="max-w-[1500px] mx-auto p-3 md:p-5 space-y-4"><nav class="erp-card p-1.5 erp-nav">
<a href="central_cadastros.html" data-page="dashboard"><i class="fa-solid fa-grid-2"></i> Visão geral</a>
<a href="cadastros_clientes.html" data-page="clientes"><i class="fa-solid fa-building"></i> Clientes</a>
<a href="cadastros_modelos.html" data-page="modelos"><i class="fa-solid fa-microchip"></i> Modelos</a>
<a href="cadastros_pecas.html" data-page="pecas"><i class="fa-solid fa-gears"></i> Peças / Estoque</a>
<a href="cadastros_consumiveis.html" data-page="consumiveis"><i class="fa-solid fa-droplet"></i> Consumíveis</a>
<a href="parque_maquinas.html" data-page="parque"><i class="fa-solid fa-industry"></i> Parque de Máquinas</a>
</nav>
<script>document.addEventListener('DOMContentLoaded',()=>{const p=document.body.dataset.erpPage||'',k=p==='cliente-ficha'?'clientes':p==='parque-ficha'?'parque':p;document.querySelector(`[data-page="${k}"]`)?.classList.add('active')});</script><div class="erp-card p-4 md:p-5 flex flex-col lg:flex-row lg:items-center justify-between gap-4"><div><span class="erp-pill bg-blue-50 text-blue-700">CLIENTES</span><h1 class="erp-page-title mt-2">Cadastro de Clientes</h1><p class="erp-muted mt-1">Base oficial do Portal CIJ.</p></div><button class="erp-btn erp-btn-primary" onclick="window.abrirCliente()"><i class="fa-solid fa-plus"></i> Novo cliente</button></div>
<div class="erp-card p-3 md:p-4 grid lg:grid-cols-[1fr_190px] gap-3"><input id="busca" class="erp-input" oninput="window.renderClientes()" placeholder="Buscar nome, CNPJ, cidade ou contato..."><select id="situacao" class="erp-input" onchange="window.renderClientes()"><option value="">Todos</option><option value="ATIVO">Ativos</option><option value="INATIVO">Inativos</option></select></div>
<div class="erp-card overflow-hidden"><div class="overflow-auto erp-scroll max-h-[61vh]"><table class="erp-table w-full min-w-[1100px]"><thead><tr><th>Cliente</th><th>CNPJ</th><th>Localização</th><th>Contato principal</th><th>Máquinas</th><th>OS abertas</th><th>Situação</th><th>Ações</th></tr></thead><tbody id="tb-clientes"></tbody></table></div></div><div id="modal-cliente" class="erp-modal hidden"><div class="erp-modal-card"><form onsubmit="window.salvarCliente(event)">
<div class="p-5 border-b flex justify-between"><div><span class="erp-pill bg-blue-50 text-blue-700">CLIENTE</span><h2 id="cliente-titulo" class="text-xl font-black mt-2">Novo cliente</h2></div><button type="button" class="erp-btn erp-btn-light !w-10 !px-0" onclick="window.erpClose('modal-cliente')"><i class="fa-solid fa-xmark"></i></button></div>
<div class="p-5 space-y-4"><input id="cli-id" type="hidden">
<div class="grid md:grid-cols-2 gap-4"><label><span class="erp-label">Razão social *</span><input id="cli-razao" class="erp-input" required></label><label><span class="erp-label">Nome fantasia</span><input id="cli-fantasia" class="erp-input"></label></div>
<div class="grid md:grid-cols-4 gap-4"><label><span class="erp-label">CNPJ</span><input id="cli-cnpj" class="erp-input"></label><label class="md:col-span-2"><span class="erp-label">E-mail</span><input id="cli-email" type="email" class="erp-input"></label><label><span class="erp-label">Situação</span><select id="cli-ativo" class="erp-input"><option value="true">ATIVO</option><option value="false">INATIVO</option></select></label></div>
<div class="grid md:grid-cols-4 gap-4"><label><span class="erp-label">CEP</span><input id="cli-cep" class="erp-input"></label><label class="md:col-span-2"><span class="erp-label">Logradouro</span><input id="cli-logradouro" class="erp-input"></label><label><span class="erp-label">Número</span><input id="cli-numero" class="erp-input"></label></div>
<div class="grid md:grid-cols-4 gap-4"><label><span class="erp-label">Complemento</span><input id="cli-complemento" class="erp-input"></label><label><span class="erp-label">Bairro</span><input id="cli-bairro" class="erp-input"></label><label><span class="erp-label">Cidade *</span><input id="cli-cidade" class="erp-input" required></label><label><span class="erp-label">UF *</span><input id="cli-uf" maxlength="2" class="erp-input uppercase" required></label></div>
<div class="erp-card p-4 bg-slate-50"><div class="flex justify-between items-center"><div><h3 class="erp-section-title">Contatos</h3><p class="erp-muted">Contato principal para WhatsApp e comunicação</p></div><button type="button" class="erp-btn erp-btn-light" onclick="window.adicionarContato()"><i class="fa-solid fa-plus"></i> Contato</button></div><div id="contatos" class="mt-3 space-y-2"></div></div>
<label><span class="erp-label">Observações gerais</span><textarea id="cli-obs" class="erp-input min-h-28" placeholder="Informações relevantes sobre o cliente..."></textarea></label></div>
<div class="p-5 border-t bg-slate-50 flex justify-end gap-2"><button type="button" class="erp-btn erp-btn-light" onclick="window.erpClose('modal-cliente')">Cancelar</button><button class="erp-btn erp-btn-primary">Salvar cliente</button></div></form></div></div></div></main>
<script type="module" src="core.js?v=20260925-1700"></script>
<script src="erp-cadastros-v4.js?v=20260925-1700"></script>
</body></html>
