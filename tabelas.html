<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentos Oficiais - Portal CIJ</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; overflow-x: hidden; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #e2e8f0; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-50">

    <!-- ÁREA CENTRAL DE CONTEÚDO (DOCUMENTOS OFICIAIS) -->
    <main class="flex-1 w-full max-w-7xl mx-auto flex flex-col p-4 md:p-6 relative gap-6 custom-scrollbar overflow-y-auto h-[calc(100vh-64px)] hidden" id="main-content">
        
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h2 class="text-2xl font-black text-slate-900 tracking-tight flex items-center gap-3"><i class="fa-solid fa-file-pdf text-amber-600"></i> Base de Documentos Oficiais</h2>
                <p class="text-xs text-slate-500 mt-1">Consulta, visualização e download de arquivos e manuais.</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-10">
            
            <section id="sec-upload-tabela" class="lg:col-span-4 bg-white p-6 rounded-3xl shadow-sm border border-slate-200 h-fit hidden">
                <div class="flex items-center gap-2 border-b border-slate-100 pb-3 mb-5">
                    <i class="fa-solid fa-cloud-arrow-up text-amber-600 text-lg"></i><h3 class="text-base font-bold text-slate-900">Novo Documento</h3>
                </div>
                <form id="form-upload-tabela" class="space-y-4" onsubmit="window.salvarNovaTabelaPrecos(event)">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Título / Nome *</label>
                        <input type="text" id="tab_nome" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 text-slate-900 rounded-xl text-xs font-medium outline-none focus:border-amber-600">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Categoria *</label>
                        <select id="tab_categoria" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 text-slate-900 rounded-xl text-xs font-semibold outline-none focus:border-amber-600">
                            <option value="Equipamentos CIJ / TIJ / Laser">Equipamentos CIJ / TIJ / Laser</option>
                            <option value="Insumos e Fluidos">Insumos e Fluidos</option>
                            <option value="Peças e Acessórios">Peças e Acessórios</option>
                            <option value="Manuais e Guias">Manuais e Guias</option>
                            <option value="Geral / Consolidada">Geral / Consolidada</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Arquivo *</label>
                        <input type="file" id="tab_arquivo" required accept=".pdf,.xlsx,.xls,.doc,.docx,.png,.jpg" class="w-full text-xs text-slate-600 file:mr-3 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:bg-amber-100 file:text-amber-800 cursor-pointer">
                        <p class="text-[10px] text-slate-400 mt-1">O sistema fará o upload para o Firebase Storage.</p>
                    </div>
                    <button type="submit" id="btn-upload-tab" class="w-full py-3 bg-amber-600 hover:bg-amber-700 text-white font-extrabold rounded-xl text-xs shadow-md flex items-center justify-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Publicar Documento
                    </button>
                </form>
            </section>

            <section id="sec-list-tabelas" class="lg:col-span-12 bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-5">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-file-pdf text-amber-600 text-lg"></i>
                        <h3 class="text-base font-bold text-slate-900">Arquivos Disponíveis</h3>
                    </div>
                    <span id="tab-count-badge" class="text-xs px-2.5 py-1 bg-amber-100 text-amber-900 font-extrabold rounded-full border border-amber-300">0</span>
                </div>
                
                <div class="overflow-x-auto border border-slate-200 rounded-xl custom-scrollbar">
                    <table class="w-full text-left text-xs whitespace-nowrap min-w-[700px]">
                        <thead class="bg-slate-900 text-white font-bold border-b border-slate-800">
                            <tr>
                                <th class="p-3">NOME DO DOCUMENTO</th>
                                <th class="p-3">CATEGORIA</th>
                                <th class="p-3">DATA</th>
                                <th class="p-3 text-center">AÇÕES (VER / BAIXAR)</th>
                                <th id="col-excluir-header" class="p-3 text-center hidden">EXCLUIR</th>
                            </tr>
                        </thead>
                        <tbody id="tabelas-table-body" class="divide-y divide-slate-100 font-medium text-slate-700"></tbody>
                    </table>
                </div>
                
                <div id="empty-state-tabelas" class="hidden p-8 text-center text-slate-400">
                    <i class="fa-solid fa-folder-open text-3xl mb-2 opacity-50"></i>
                    <p class="text-sm">Nenhum documento disponível no momento.</p>
                </div>
            </section>
        </div>
    </main>

    <!-- MOTOR CENTRAL DO SISTEMA -->
    <script type="module" src="core.js"></script>

    <!-- LÓGICA DE EXPORTAR FUNÇÕES DO STORAGE PARA O WINDOW -->
    <script type="module">
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";
        
        window.AppStorageObj = getStorage(window.AppAuth.app);
        window.fazerUploadFirebaseStorage = async function(file) {
            const storageRef = ref(window.AppStorageObj, 'documentos_oficiais/' + Date.now() + '_' + file.name);
            await uploadBytesResumable(storageRef, file);
            const downloadURL = await getDownloadURL(storageRef);
            return downloadURL;
        };
    </script>

    <!-- LÓGICA DO MÓDULO DOCUMENTOS OFICIAIS -->
    <script>
        window.listaTabelas = [];

        window.initModule = function(perfil) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');

            // Determina se é Admin para mostrar painel de upload
            const isAdmin = (perfil === 'Admin');
            window.aplicarLayoutDePermissao(isAdmin);

            // Conecta ao banco de dados específico (tabelas_precos)
            const tabelasRef = window.fsCollection(window.AppDB, 'artifacts', 'plataforma-cij', 'public', 'data', 'tabelas_precos');
            
            // Usando OnSnapshot simples para puxar as tabelas (sem o query/orderBy que exige importações difíceis no core)
            window.fsOnSnapshot(tabelasRef, (snapshot) => { 
                const docs = []; 
                snapshot.forEach(d => docs.push(d.data())); 
                
                // Ordenar por data mais recente
                docs.sort((a, b) => b.timestamp - a.timestamp);

                window.listaTabelas = docs; 
                window.renderizarTabelasPrecos(); 
            });
        };

        window.aplicarLayoutDePermissao = function(isAdmin) {
            const formSection = document.getElementById('sec-upload-tabela');
            const listSection = document.getElementById('sec-list-tabelas');
            const headerExcluir = document.getElementById('col-excluir-header');
            
            if (isAdmin) { 
                formSection.classList.remove('hidden'); 
                listSection.className = "lg:col-span-8 bg-white p-6 rounded-3xl shadow-sm border border-slate-200"; 
                headerExcluir.classList.remove('hidden'); 
            } else { 
                formSection.classList.add('hidden'); 
                listSection.className = "lg:col-span-12 bg-white p-6 rounded-3xl shadow-sm border border-slate-200"; 
                headerExcluir.classList.add('hidden'); 
            }
        };

        window.salvarNovaTabelaPrecos = async function(e) {
            e.preventDefault(); 
            if (!window.isUserAdminOrFinance) return;
            
            const arquivoInput = document.getElementById('tab_arquivo');
            const file = arquivoInput.files[0];
            
            if (!file) {
                window.mostrarNotificacao('Por favor, selecione um arquivo.', true);
                return;
            }

            const btn = document.getElementById('btn-upload-tab'); 
            const textoOriginal = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Enviando Arquivo...'; 
            btn.disabled = true;

            let downloadURL = "#";
            let uploadRealSucesso = false;

            try {
                if (typeof window.fazerUploadFirebaseStorage === 'function') {
                    try {
                        downloadURL = await window.fazerUploadFirebaseStorage(file);
                        uploadRealSucesso = true;
                    } catch (storageErr) {
                        console.warn("Storage Error:", storageErr);
                        alert("AVISO: O Firebase Storage recusou o upload. Certifique-se que o Storage está ativo com regras de leitura/gravação públicas.");
                        downloadURL = "#erro_storage";
                    }
                }

                const novoDoc = { 
                    id: Date.now().toString(), 
                    nome: document.getElementById('tab_nome').value.trim(), 
                    categoria: document.getElementById('tab_categoria').value, 
                    nome_arquivo: file.name, 
                    url_arquivo: downloadURL, 
                    data: new Date().toISOString().split('T')[0], 
                    timestamp: new Date().getTime() 
                };

                await window.fsSetDoc(window.fsDoc(window.AppDB, 'artifacts', 'plataforma-cij', 'public', 'data', 'tabelas_precos', novoDoc.id), novoDoc);
                
                if (uploadRealSucesso) {
                    window.mostrarNotificacao('Documento enviado e publicado com sucesso!'); 
                } else {
                    window.mostrarNotificacao('Registro criado (Sem Arquivo Real).', true); 
                }
                
                document.getElementById('form-upload-tabela').reset(); 
                
            } catch(error) { 
                console.error("Erro no upload:", error);
                window.mostrarNotificacao('Erro geral ao processar. Verifique sua conexão.', true); 
            } finally { 
                btn.innerHTML = textoOriginal; 
                btn.disabled = false; 
            }
        };

        window.excluirTabelaPrecos = async function(id) {
            if (!window.isUserAdminOrFinance) return;
            if(confirm("Deseja apagar este documento oficial?")) {
                try { 
                    await window.fsDeleteDoc(window.fsDoc(window.AppDB, 'artifacts', 'plataforma-cij', 'public', 'data', 'tabelas_precos', id));
                    window.mostrarNotificacao('Documento excluído.'); 
                } catch(e) {}
            }
        };

        window.renderizarTabelasPrecos = function() {
            const tbody = document.getElementById('tabelas-table-body'); 
            const empty = document.getElementById('empty-state-tabelas');
            if(!tbody) return; 
            
            tbody.innerHTML = '';
            document.getElementById('tab-count-badge').innerText = `${window.listaTabelas.length} documento(s)`;
            
            if (window.listaTabelas.length === 0) { 
                empty.classList.remove('hidden'); 
            } else {
                empty.classList.add('hidden');
                window.listaTabelas.forEach(item => {
                    const c = item.categoria === 'Equipamentos CIJ / TIJ / Laser' ? 'bg-purple-100 text-purple-700' :
                              item.categoria === 'Insumos e Fluidos' ? 'bg-emerald-100 text-emerald-700' :
                              item.categoria === 'Peças e Acessórios' ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700';
                    
                    const ex = window.isUserAdminOrFinance ? `<td class="p-3 text-center"><button onclick="window.excluirTabelaPrecos('${item.id}')" title="Excluir Documento" class="text-slate-400 hover:text-red-500 hover:bg-red-50 p-2 rounded-lg transition"><i class="fa-solid fa-trash"></i></button></td>` : '';
                    
                    const isUrlValida = item.url_arquivo && item.url_arquivo !== '#' && !item.url_arquivo.includes('erro_storage');
                    
                    let actions = '';
                    if (isUrlValida) {
                        actions = `
                            <div class="flex items-center justify-center gap-2">
                                <a href="${item.url_arquivo}" target="_blank" title="Visualizar Documento no Navegador" class="px-3 py-1.5 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 font-bold text-[11px] rounded-lg transition flex items-center gap-1.5 shadow-sm">
                                    <i class="fa-solid fa-eye"></i> Visualizar
                                </a>
                                <a href="${item.url_arquivo}" download target="_blank" title="Fazer Download do Arquivo" class="px-3 py-1.5 bg-sky-100 hover:bg-sky-200 text-sky-700 font-bold text-[11px] rounded-lg transition flex items-center gap-1.5 shadow-sm">
                                    <i class="fa-solid fa-download"></i> Baixar
                                </a>
                            </div>
                        `;
                    } else {
                        actions = `<div class="flex justify-center"><span class="text-[10px] text-amber-700 font-bold bg-amber-50 px-2.5 py-1.5 rounded-lg border border-amber-200 flex items-center gap-1"><i class="fa-solid fa-triangle-exclamation"></i> Arquivo indisponível</span></div>`;
                    }

                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50 transition border-b border-slate-100">
                            <td class="p-3">
                                <span class="block font-bold text-slate-800">${item.nome}</span>
                                <span class="text-[10px] text-slate-500 mt-0.5 inline-block"><i class="fa-solid fa-paperclip mr-0.5"></i> ${item.nome_arquivo}</span>
                            </td>
                            <td class="p-3"><span class="text-[10px] px-2 py-1 rounded-md font-bold ${c}">${item.categoria}</span></td>
                            <td class="p-3 text-slate-600 font-medium">${item.data.split('-').reverse().join('/')}</td>
                            <td class="p-3 text-center">${actions}</td>
                            ${ex}
                        </tr>
                    `;
                });
            }
        };
    </script>
</body>
</html>
